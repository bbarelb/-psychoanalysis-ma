<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מפת הפסיכואנליזה</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--text:#242424;--muted:#6e6b65;--line:#c9c5bd;--accent:#335c67;--soft:#e9f0f1}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:1050px;margin:auto;padding:22px 14px 40px} h1{font-size:25px;margin:0 0 6px}.lead{color:var(--muted);margin:0 0 18px}
.map{overflow-x:auto;background:#fff;border:1px solid #ddd8cf;border-radius:18px;padding:10px}
svg{display:block;min-width:850px;width:100%;height:auto}.edge{fill:none;stroke:var(--line);stroke-width:2}.dash{stroke-dasharray:6 5}
.node{cursor:pointer}.node rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}.node text{fill:var(--text);font-family:inherit;pointer-events:none}
.node.active rect{fill:var(--soft);stroke:var(--accent);stroke-width:3}
.detail{margin-top:16px;background:#fff;border:1px solid #ddd8cf;border-radius:18px;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
h2{font-size:21px;margin:0}.years{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
h3{font-size:14px;margin:0 0 5px}.detail p{margin:0;line-height:1.55}.books{margin:6px 0 0;padding-right:20px;line-height:1.55}
.note{font-size:13px;color:var(--muted);margin-top:12px}.legend{font-size:12px;color:var(--muted);text-align:center;margin-top:7px}
@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:22px}}
</style>
</head>

};
const box=document.getElementById("detail");
function show(id){const d=D[id];document.querySelectorAll(".node").forEach(n=>n.classList.toggle("active",n.dataset.id===id));box.innerHTML=`<div class="top"><h2>${d.t}</h2><span class="years">${d.y}</span></div><div class="grid"><div><h3>הרעיון המרכזי</h3><p>${d.idea}</p><h3 style="margin-top:14px">מה מרפא?</h3><p>${d.heal}</p></div><div><h3>דמויות מרכזיות</h3><p>${d.names}</p><h3 style="margin-top:14px">טקסטים מרכזיים</h3><ul class="books">${d.books.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>`}
document.querySelectorAll(".node").forEach(n=>{n.addEventListener("click",()=>show(n.dataset.id));n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();show(n.dataset.id)}})});
show("freud");
</script>
